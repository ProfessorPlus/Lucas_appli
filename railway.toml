# Railway service config — picked up automatically when you deploy from this repo.
# https://docs.railway.app/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# startCommand intentionnellement omis : Railway exécute le CMD du Dockerfile
# qui passe par sh -c et résout correctement ${PORT}. Si on remet un
# startCommand ici, il faut le wrapper en `sh -c '...'` sinon $PORT est passé
# en littéral à uvicorn et il plante avec "Invalid value for '--port'".
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
